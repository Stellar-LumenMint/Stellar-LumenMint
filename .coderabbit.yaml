# CodeRabbit review configuration.
#
# This file is the repository half of the automated-reviewer setup; the
# CodeRabbit GitHub App still has to be installed on the organisation for it to
# run. The settings below are chosen to make the review useful on *this*
# repository rather than to enable everything:
#
#   * generated files are excluded, so the review discusses code rather than
#     diffs it cannot meaningfully comment on;
#   * the contract sources get instructions about the invariants that matter,
#     because a plausible-looking contract change can move funds;
#   * the review is advisory. Branch protection, not this bot, is what decides
#     whether a change may merge.
language: en-US
early_access: false

reviews:
  # "chill" summarises and flags what is wrong without commenting on style the
  # linters already enforce. `assertive` duplicates ESLint and Prettier output.
  profile: chill

  # Do not block a pull request on the bot's opinion. A human review and the CI
  # gates are the merge criteria; see the branch-protection discussion in the
  # issue tracker.
  request_changes_workflow: false

  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  collapse_walkthrough: false

  poem: false

  auto_review:
    enabled: true
    drafts: false
    # Dependabot bumps do not need a prose review; CI and the dependency audit
    # are the checks that matter for them.
    ignore_title_keywords:
      - 'build(deps)'
      - 'chore(deps)'
      - 'bump the'

  tools:
    # Off deliberately: the repository runs the authoritative versions of these
    # in CI (gitleaks, CodeQL, cargo-audit, per-workspace dependency audit), and
    # a second opinion that disagrees with the gate it is shadowing is noise.
    gitleaks:
      enabled: false
    checkov:
      enabled: false

  path_instructions:
    - path: 'soroban/contracts/**/*.rs'
      instructions: |
        Contract changes are held to a higher bar than the rest of the
        repository: a defect can move funds.

        Check specifically for:
        - a state-changing entry point without `require_auth()` and a reentrancy
          guard;
        - monetary arithmetic that does not go through the checked helpers, and a
          distribution that is not validated to sum exactly to the input before
          any transfer is made;
        - a new error code that no call path can actually return, or an existing
          code renumbered or reused for a new meaning (numbers are part of the
          on-chain interface and retired numbers are never recycled);
        - `SettlementError` growth — Soroban caps an error enum at 50 variants
          and that enum is at 49;
        - a storage-layout change with no thought for existing records or the TTL;
        - a hot-path change with no benchmark ceiling to catch the regression.

    - path: 'soroban/contracts/**/test/**'
      instructions: |
        Tests should assert the specific error, not merely that a call failed:
        `is_err()` cannot tell one failure from another and lets a refactor that
        collapses two conditions onto one error pass unnoticed.

    - path: 'backend/**/*.ts'
      instructions: |
        - Throw sites should attach a specific `AppErrorCode` via
          `withErrorCode(...)` where the reason matters; the filter derives a
          default from the status otherwise, and validation failures report
          `VALIDATION_ERROR` rather than `BAD_REQUEST`.
        - Do not forward a free-text code into a client response. Only members of
          `AppErrorCode` may reach a client.
        - Never echo internal exception detail for a 5xx response.

    - path: 'docs/ERROR_CODES.md'
      instructions: |
        Generated file. Any human edit is wrong — the registry is produced from
        the error enums by `scripts/error-code-registry.mjs` and CI fails if it
        is out of date. Comment on the source enum instead.

    - path: 'soroban/contracts/**/test_snapshots/**'
      instructions: |
        Soroban test snapshots. Regenerated by running the tests, not edited.

  # Paths the review should ignore entirely. Generated artifacts and vendored
  # output produce large diffs that no comment can improve.
  path_filters:
    - '!**/node_modules/**'
    - '!**/target/**'
    - '!**/.next/**'
    - '!**/dist/**'
    - '!**/coverage/**'
    - '!**/*.lock'
    - '!package-lock.json'
    - '!soroban/contracts/**/test_snapshots/**'
    - '!docs/ERROR_CODES.md'

chat:
  auto_reply: true

# Keep the review summary in the same voice as the repository's commits:
# explain the "why", not just the "what".
tone_instructions: |
  Be direct and concrete. Explain why a change is a problem rather than naming a
  rule, and prefer one precise comment over several restating a linter. This
  repository's commit messages and documents explain reasoning, so match that:
  if a comment could be a lint error, leave it to the linter.
