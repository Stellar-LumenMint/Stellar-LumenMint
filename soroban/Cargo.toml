[workspace]
resolver = "2"
members = [
  "contracts/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Minimum supported Rust version; kept in sync with rust-toolchain.toml and
# the CI toolchain so builds are reproducible across contributors and runners.
rust-version = "1.85"

[workspace.metadata.versioning]
strategy = "semver+git"
version_env = "CARGO_PKG_VERSION"
git_hash_env = "GIT_COMMIT_HASH"
build_timestamp_env = "BUILD_TIMESTAMP"
rustc_version_env = "RUSTC_VERSION"

[workspace.dependencies]
# Pinned to the exact patch that Cargo.lock resolves. A caret/`23` range
# would let `cargo update` silently move a deployed contract onto a new SDK
# patch, changing generated code and the Wasm hash without review.
soroban-sdk = "=27.0.6"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
