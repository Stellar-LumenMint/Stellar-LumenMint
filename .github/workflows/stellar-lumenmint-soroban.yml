name: Stellar-LumenMint Soroban CI

on:
  push:
    paths:
      - "soroban/**"
      - ".github/workflows/stellar-lumenmint-soroban.yml"
    branches: [main, develop]
  pull_request:
    paths:
      - "soroban/**"
      - ".github/workflows/stellar-lumenmint-soroban.yml"
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: stellar-lumenmint-soroban-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.85"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./soroban

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: soroban
          cache-on-failure: true

      # These four gates are hard failures. Previously each step ended in
      # `|| echo "::warning::..."`, so a broken contract crate — including a
      # parse error that stopped nft_contract from compiling at all — still
      # produced a green badge. Contract bugs move funds; they must never
      # merge silently.
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (lint)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build all contracts
        run: cargo build --workspace --release --target wasm32-unknown-unknown

      - name: Run tests
        run: cargo test --workspace
