name: Stellar-LumenMint Packages CI

on:
  push:
    paths:
      - "packages/**"
      - ".github/workflows/stellar-lumenmint-packages.yml"
    branches: [main, develop]
  pull_request:
    paths:
      - "packages/**"
      - ".github/workflows/stellar-lumenmint-packages.yml"
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: stellar-lumenmint-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [shared-types, sdk, cli, ai]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/package-lock.json

      - name: Install workspace dependencies
        working-directory: ./packages
        run: npm install

      # `npm run typecheck` rather than a bare `tsc --noEmit`: the sdk and ai
      # packages reference `shared-types` through TypeScript project
      # references, and only build mode (`tsc -b`) compiles the referenced
      # project first. A bare `tsc --noEmit` cannot resolve the workspace
      # types and fails.
      - name: Type check
        working-directory: ./packages/${{ matrix.package }}
        run: npm run typecheck --if-present

      - name: Run tests
        working-directory: ./packages/${{ matrix.package }}
        run: npm run test --if-present

      - name: Build
        working-directory: ./packages/${{ matrix.package }}
        run: npm run build --if-present
