name: Stellar-LumenMint Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: stellar-lumenmint-security-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan commits, not just the worktree.
          fetch-depth: 0

      # The gitleaks GitHub Action requires a paid licence key to run in an
      # organisation, so it aborted after five seconds on every push and the
      # scan never actually ran. The gitleaks CLI itself is free and scans the
      # same history against the same rules, so it is invoked directly.
      - name: Run gitleaks
        env:
          # Pinned so a new upstream release cannot change the ruleset silently.
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --no-banner \
            --redact \
            --exit-code 1

  dependency-audit:
    name: Dependency Audit (${{ matrix.workspace }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        workspace: [backend, frontend, mobile-app, admin]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ./${{ matrix.workspace }}
        run: |
          if [ "${{ matrix.workspace }}" = "admin" ]; then
            npm ci --legacy-peer-deps
          else
            npm ci
          fi

      # `npm audit --audit-level=high` fails on every high advisory, including
      # the ones npm reports as having no fix short of a breaking framework
      # upgrade, which leaves the job permanently red and therefore ignored.
      # This gate fails when a fix is available now and reports the rest.
      - name: Audit dependencies
        run: node scripts/dependency-audit.mjs ${{ matrix.workspace }}

  cargo-audit:
    name: Cargo Audit (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./soroban

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  error-codes:
    name: Error-Code Registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The registry is generated from the error enums, so this fails when a
      # code is added, renamed or renumbered without the document following.
      # Without this gate the document is just prose that goes stale silently —
      # and a client branching on a code that no longer exists is the exact bug
      # it is meant to prevent.
      - name: Verify the registry matches the error enums
        run: node scripts/error-code-registry.mjs --check

      - name: Show the fix when the registry is stale
        if: failure()
        run: echo "Run 'npm run errors:build' locally and commit docs/ERROR_CODES.md."
