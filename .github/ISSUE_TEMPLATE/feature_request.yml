name: Feature request
description: Suggest an idea or improvement
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: dropdown
    id: workspace
    attributes:
      label: Target workspace
      options:
        - backend
        - frontend
        - mobile-app
        - admin
        - soroban (smart contracts)
        - packages (SDK / CLI / AI)
        - CI / tooling
        - not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user-facing or engineering pain, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Optional — how you would approach it.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
