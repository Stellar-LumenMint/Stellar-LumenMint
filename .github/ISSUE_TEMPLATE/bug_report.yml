name: Bug report
description: Report something that is broken
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. For security issues, do **not**
        open a public issue — see SECURITY.md instead.
  - type: dropdown
    id: workspace
    attributes:
      label: Affected workspace
      options:
        - backend
        - frontend
        - mobile-app
        - admin
        - soroban (smart contracts)
        - packages (SDK / CLI / AI)
        - CI / tooling
        - not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact any secrets, tokens, or personal data before pasting.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse HEAD`, or the release tag.
    validations:
      required: false
